name: minecraft-bot-test

services:
  minecraft:
    image: itzg/minecraft-server:java25
    container_name: minecraft-bot-test-server
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "26.2"
      ONLINE_MODE: "FALSE"
      MEMORY: "2G"
      MAX_PLAYERS: "5"
      MOTD: "Mineflayer bot test server"
      DIFFICULTY: "peaceful"
      LEVEL_TYPE: "FLAT"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "4"
      SIMULATION_DISTANCE: "4"
    ports:
      - "25565:25565"
    volumes:
      - ./data:/data
    restart: unless-stopped
